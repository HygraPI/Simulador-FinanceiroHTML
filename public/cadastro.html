<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="css/login-cadastro.css">
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <script src="./js/sessao.js"></script>

</head>

<body onload="listar()">

  <div class="container-cadastro">

    <div class="canto_esquerdo"></div>


    <div id="cadastro" class="Caixa-Cadastro">
      <div class="alerta_erro">
        <div class="card_erro" id="cardErro">
          <span id="mensagem_erro"></span>
        </div>
      </div>

      <a href="index.html"><button class="btn-voltar">← Voltar</button></a>

      <div class="inicial">
        <img src="assets/imgs/logo hygra.png">
        <h1>Faça o seu cadastro:</h1>
      </div>

      <div class="campos">

        <div class="campo">
          <h4>Nome completo:</h4> <br>
          <input id="ipt_nomeFuncionario" type="text" placeholder="Insira seu Nome "><br><br>

          <h4>Email:</h4> <br>
          <input id="ipt_email" type="text" placeholder="Insira seu email"> <br><br>

          <h4>CPF:</h4> <br>
          <input id="ipt_cpf" placeholder="Insira seu cpf"> <br><br>

        </div>

        <div class="campo">
          <h4>Crie uma senha:</h4> <br>
          <input id="ipt_senha" type="password" placeholder="Insira sua senha"> <br><br>

          <h4>Confirme sua senha:</h4> <br>
          <input id="ipt_confirmarSenha" type="password" placeholder="Insira a senha novamente">
          <br><br>

          <h4>Código de ativação:</h4> <br>
          <input id="codigo_input" type="text" placeholder="Insira o código de ativação">
          <br><br>
        </div>
      </div>
      <button onclick="cadastrar()">FINALIZAR CADASTRO</button>
    </div>
    <div id="msg"></div>
    <div id="div_aguardar" class="loading-div">
      <img src="./assets/circle-loading.gif" id="loading-gif" />
    </div>

    <div id="div_erros_login"></div>

    <!-- </div> -->


    <div class="canto_direito"></div>

  </div>
</body>

</html>
<script>
  let tentativas = 0;



  // script de cadastro da web
  let listaEmpresasCadastradas = [];

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = ipt_nomeFuncionario.value;
    var emailVar = ipt_email.value;
    var senhaVar = ipt_senha.value;
    var cpfVar = ipt_cpf.value;
    var confirmacaoSenhaVar = ipt_confirmarSenha.value;
    var codigoVar = codigo_input.value;
    var idEmpresaVincular

    // Verificando se há algum campo em branco
    if (nomeVar == "" || emailVar == "" || senhaVar == "" || cpfVar == "" || confirmacaoSenhaVar == "" || codigoVar == "") {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML = "Há algum campo em branco";
      setInterval(sumirMensagem, 3000);
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
      if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
        idEmpresaVincular = listaEmpresasCadastradas[i].idEmpresa
        console.log("Código de ativação válido.");
        break;
      } else {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Código de ativação inválido";
        setInterval(sumirMensagem, 3000);
        return false
      }
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        cpfServer: cpfVar,
        idEmpresaVincularServer: idEmpresaVincular
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  // Listando empresas cadastradas 
  function listar() {
    fetch("/empresas/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaEmpresasCadastradas.push(empresa);

            console.log("listaEmpresasCadastradas")
            console.log(listaEmpresasCadastradas[0].codigo_ativacao)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }

</script>

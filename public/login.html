<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="js/sessao.js"></script>
    <link rel="stylesheet" href="./css/login-cadastro.css">
   
</head>

<body>

<div class="container-login">

    <!-- LADO ESQUERDO (IMAGEM) -->
    <div class="esquerda-fundo"></div>

    <!-- LADO DIREITO (LOGIN) -->
    <div class="direita-form">
        
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>

        <div class="caixa-login">

            <a href="index.html"><button class="btn-voltar">← Voltar</button></a>

            <img src="assets/imgs/logo hygra.png" alt="Logo Hygra" class="logo-login">

            <h1>Faça o seu login</h1>

            <h4>Seu E-mail</h4>
            <input type="email" id="ipt_email" placeholder="Insira seu email...">

            <h4>Sua Senha</h4>
            <input type="password" id="ipt_senha" placeholder="Insira sua senha...">

            <button onclick="entrar()">ENTRAR</button><br><br><br>

            Não tem uma conta? <a href="cadastro.html">Crie a sua conta Hygra</a>

            <div id="div_erros_login"></div>
            
        </div>
    </div>

</div>



</body>

</html>
<script>
    console.log(sessionStorage.ID_USUARIO)
    let tentativas = 0;

    // script do login da web-data-viz
    function entrar() {


        var emailVar = ipt_email.value;
        var senhaVar = ipt_senha.value;

        if (emailVar == "" || senhaVar == "") {
            alert("Complete todos os campos")
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.TIPO_USUARIO = json.tipo;
                    sessionStorage.ID_EMPRESA = json.empresaId;



                    if (sessionStorage.TIPO_USUARIO == 'suporte') {
                       setTimeout(function () {
                        window.location = "./bobia";
                    }, 1000); // apenas para exibir o loading 
                    } else {
                        setTimeout(function () {
                            window.location = "./site-pi-public/paginas/dashboard/menu.html";
                        }, 1000); // apenas para exibir o loading
                    }


                });

            } else {
                
                console.log("Houve um erro ao tentar realizar o login.");

                resposta.text().then(texto => {
                    console.error(texto);
                    alert("Email ou senha inválidos. Tente novamente")

                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

</script>

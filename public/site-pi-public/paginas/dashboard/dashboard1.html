<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Dashboard</title>
</head>

<body class="corpodashboard">

    <header class="header">
        <div class="header-left">
            <img class="img-header" src="../../../assets/imgs/logo-sem-fundo.png">
            <h3 class="h3-header">Hygra</h3>
        </div>

        <div class="BoasVindas">
            <span id="mensagemBoasVindas"></span>
        </div>

        <a href="../../paginas/dashboard/menu.html"><button class="button-header">Voltar</button></a>

    </header>

    <div class="containerkpi">
        <div class="kpis">
            <div class="kpi_destaque kpi">
                <p class="kpi_titulo">Identificação do sensor:</p>
                <h2 class="kpi_valor" id="kpiSensor">-</h2>
            </div>
            <div class="kpi kpi_destaque">
                <p class="kpi_titulo"> Tipo de Tecido:</p>
                <h2 class="kpi_valor" id="tipoTecido">-</h2>
            </div>
            <div class="kpi kpi_destaque">
                <p class="kpi_titulo"> Umidade atual:</p>
                <h2 class="kpi_valor" id="umidadeAtual">0</h2>
            </div>
            <div class="kpi kpi_destaque">
                <p class="kpi_titulo"> Último alerta:</p>
                <h2 class="kpi_valor" id="ultimoAlerta" style="font-size: 25px;">-</h2>
            </div>
            <div class="metrica">
                <p class="kpi_titulo">Umidade ideal:</p>
                <p>Seda: 45–55%</p>
                <p>Algodão:40–50%</p>
                <p>Linho:50–60%</p>
                <p>Lã: 55–65%</p>
            </div>
        </div>
    </div>


    <div class="graficos">

        <div class="grafico">
            <div class="grafico_titulo">Variação de umidade</div>
            <canvas id="sensorDigital"></canvas>
        </div>

        <div class="grafico">
            <div class="grafico_titulo">Tempo fora da faixa ideal</div>
            <canvas id="sensorDigital3"></canvas>
        </div>

    </div>

    <footer class="footer_dashboard">
        <p>© 2026 Hygra. Todos os direitos reservados.</p>
    </footer>

    <script>
        let idSensor = sessionStorage.ID_SENSOR;
        console.log(idSensor);

        function carregarUltimaLeitura() {

            fetch(`/medidas/ultima-leitura/${idSensor}`)
                .then(function (resposta) {

                    return resposta.json();

                }).then(function (dados) {

                    console.log(dados);

                    umidadeAtual.innerHTML = dados[0].umidade + '%';

                });

        }

        function carregarSensor() {

            fetch(`/medidas/sensor/${idSensor}`)
                .then(function (resposta) {
                    return resposta.json();
                })
                .then(function (dados) {

                    console.log(dados);

                    document.getElementById("kpiSensor").innerHTML =
                        dados[0].idSensor;

                });

        }

        function carregarUltimoAlerta() {

            fetch(`/medidas/ultimo-alerta/${idSensor}`)
                .then(function (resposta) {

                    return resposta.json();

                }).then(function (dados) {

                    var data = new Date(dados[0].dataAlerta);

                    var dataFormatada =
                        data.toLocaleDateString("pt-BR") + " " +
                        data.toLocaleTimeString("pt-BR", {
                            hour: '2-digit',
                            minute: '2-digit'
                        });

                    document.getElementById("ultimoAlerta").innerHTML =
                        dataFormatada;

                    console.log(dados);

                });

        }

        function carregarTipoTecido() {

            fetch(`/medidas/tipo-tecido/${idSensor}`)
                .then(function (resposta) {

                    return resposta.json();

                }).then(function (dados) {

                    document.getElementById("tipoTecido").innerHTML =
                        dados[0].nome;

                });

        }

        var sensorDigital = new Chart(document.getElementById('sensorDigital').getContext('2d'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Umidade',
                        data: [],
                        borderColor: '#648A55',
                        backgroundColor: 'rgba(78, 160, 54, 0.1)',
                        fill: true
                    },
                    {
                        label: 'Mínimo Ideal',
                        data: [],
                        borderColor: '#3b57a2',
                        borderDash: [5, 5],
                        pointRadius: 0
                    },
                    {
                        label: 'Máximo Ideal',
                        data: [],
                        borderColor: '#c93c3c',
                        borderDash: [5, 5],
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });

        function carregarGraficoUmidade() {

            fetch(`/medidas/grafico-umidade/${idSensor}`)
                .then(function (resposta) {

                    return resposta.json();

                })
                .then(function (dados) {

                    console.log(dados);

                    var labels = [];
                    var valores = [];

                    dados.reverse();

                    for (var i = 0; i < dados.length; i++) {

                        labels.push(dados[i].horario);
                        valores.push(dados[i].umidade);

                    }

                    sensorDigital.data.labels = labels;

                    sensorDigital.data.datasets[0].data = valores;

                    sensorDigital.data.datasets[1].data =
                        Array(valores.length).fill(dados[0].minUmidade);

                    sensorDigital.data.datasets[2].data =
                        Array(valores.length).fill(dados[0].maxUmidade);

                    sensorDigital.update();

                });

        }

                var sensorDigital = new Chart(document.getElementById('sensorDigital').getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [
                            {
                                label: 'Umidade',
                                borderColor: '#648A55',
                                backgroundColor: 'rgba(78, 160, 54, 0.1)',
                                fill: true
                            },
                            {
                                label: 'Mínimo Ideal',
                                borderColor: '#3b57a2',
                                borderDash: [5, 5],
                                pointRadius: 0,
                            },
                            {
                                label: 'Máximo Ideal',
                                borderColor: '#c93c3c',
                                borderDash: [5, 5],
                                pointRadius: 0,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
        
                            x: {
                                beginAtZero: true
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: '(%)'
                                },
                                beginAtZero: true
                            }
                        }
                    }
                });*/

        var sensorDigital3 = new Chart(document.getElementById('sensorDigital3').getContext('2d'), {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    label: 'Horas fora da faixa ideal de umidade',
                    borderColor: '#648A55',
                    backgroundColor: '#648A55',
                    borderRadius: 20,
                    data: []
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    x: {
                        beginAtZero: true
                    },
                    y: {
                        title: {
                            display: true,
                            text: '(Horas)'
                        },
                        beginAtZero: true
                    }
                }
            }
        });

        function carregarTempoForaFaixa() {

            fetch(`/medidas/tempo-fora-faixa/${idSensor}`)
                .then(function (resposta) {

                    return resposta.json()

                })
                .then(function (dados) {

                    console.log("Tempo fora da faixa:", dados);

                    var labels = [];
                    var valores = [];

                    for (var i = 0; i < dados.length; i++) {

                        const data = new Date(dados[i].dia);

                        if (sensorDigital3.data.labels.length == 10) {
                            sensorDigital3.data.labels.shift()
                            sensorDigital3.data.datasets[0].data.shift()
                        }

                        labels.push(
                            data.toLocaleDateString('pt-BR')
                        ); valores.push(dados[i].horasFora);

                    }

                    sensorDigital3.data.labels = labels;

                    sensorDigital3.data.datasets[0].data = valores;

                    sensorDigital3.update();

                    // fetch(`/medidas/tempo-fora-faixa/1`)
                    //     .then(resposta => resposta.json())
                    //     .then(dados => {
                    //         console.log("TEMPO FORA:", dados);
                    //     });

                })
                .catch((resposta) => {
                    console.log(resposta)
                });

        }

        carregarUltimaLeitura();
        carregarSensor();
        carregarUltimoAlerta();
        carregarTipoTecido();
        carregarGraficoUmidade();
        carregarTempoForaFaixa();

        setInterval(carregarGraficoUmidade, 1000);



    </script>
</body>

</html>

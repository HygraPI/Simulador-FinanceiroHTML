<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hygra | Menu Inicial</title>

    <link rel="preconnect" href="https://fonts.gstatic.com">

    <link rel="stylesheet" href="../../css/menu.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body onload="listarSensores(), exibirSensores()">

    <div class="container-principal">
        <header>
            <div class="img-span">
                <img src="../../../assets/imgs/logo-sem-fundo.png" class="logo-header" alt="Logo Hygra">
                <span id="labelNomeEmpresa">Hygra</span>
            </div>

            <div class="BoasVindas">
                <span id="mensagemBoasVindas">Bem vindo, Usuário!</span>
            </div>

            <div class="btnVoltar">
                <a href="/login.html">
                    <button id="btnSair" onclick="sessionStorage.clear()">Sair</button>
                </a>
            </div>
        </header>

        <div class="conteudo-principal">
            <div class="titulo-descricao">
                <span class="titulo">Sensores do Sistema</span>
                <p class="descricao">
                    Acesse todos os sensores do sistema e verifique uma dashboard para <br>
                    analisar o status de cada sensor.</p>
            </div>

            <div class="container-KPI">
                <p>Total de sensores em alerta:</p>
                <p class="valor" id="qtd_sensores_em_alerta">2</p>
            </div>

            <div class="container-tabela-card">
                <table class="tabela-sensores">
                    <thead>
                        <tr>
                            <th>SENSOR</th>
                            <th>SETOR</th>
                            <th>TECIDO</th>
                            <th>ÚLTIMA LEITURA (Umidade)</th>
                            <th>STATUS DE ALERTA</th>
                            <th>MÉTRICAS</th>
                        </tr>
                    </thead>
                    <tbody id="conteudo_tabela">

                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <footer class="footer">
        <p>© 2026 Hygra. Todos os direitos reservados.</p>
    </footer>
</body>

<script>

    console.log(sessionStorage.ID_EMPRESA)

    let listaSensores = []

    const celulasStatus = document.querySelectorAll('.status');

    celulasStatus.forEach(element => {

        let textStatus = element.textContent.trim();

        if (textStatus === 'Crítico') {
            element.style.color = 'red';
        } else if (textStatus === 'Ideal') {
            element.style.color = 'green';
        }
    });

    var nome = sessionStorage.NOME_USUARIO
    mensagemBoasVindas.innerHTML = `Seja bem vindo, ${nome}!`

    function listarSensores() {
        listaSensores = []
        fetch("/sensores/listarSensores", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                idEmpresaServer: sessionStorage.ID_EMPRESA
            })
        })
            .then(function (resposta) {
                if (resposta.ok) {
                    console.log("Ta dentro do then!")
                    resposta.json().then((sensores) => {
                        listaSensores = sensores;
                        exibirSensores()
                        });
                    ;
                }
            })
            .catch(function (resposta) {
                console.log(resposta)
            })
    }

    function exibirSensores() {
        let qtdSensoresEmAlerta = 0;
            conteudo_tabela.innerHTML = ''
            console.log(listaSensores)
            for (let i = 0; i <= listaSensores.length - 1; i++) {
                conteudo_tabela.innerHTML += `
                <tr>
                    <td class="sensor">${listaSensores[i].idSensor}</td>
                    <td class="localizacao">${listaSensores[i].idSetor}</td>
                    <td class="tecido">${listaSensores[i].tecido}</td>
                    <td class="porcentagem">${listaSensores[i].leitura}%</td>
                    <td class="status">${listaSensores[i].StatusDeAlerta}</td>
                    <td><a href="./dashboard1.html">
                            <button id="Dashboard" onclick="sessionStorage.ID_SENSOR = ${listaSensores[i].idSensor}">Ver Dashboard</button>
                        </a>
                    </td>
                </tr>
            `
                if (listaSensores[i].StatusDeAlerta != 'umidade ideal') {
                    qtdSensoresEmAlerta++
                }
            }
            qtd_sensores_em_alerta.innerHTML = qtdSensoresEmAlerta;
    }

    setInterval(listarSensores, 1000);


</script>

</html>
